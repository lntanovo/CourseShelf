[project]
name = "courseshelf"
version = "1.2.0"
description = "Offline Windows timetable and course material organizer"
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "build", "dist", "artifacts", ".tmp", "build-debug", "dist-debug"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
exclude = '(^|/)(\.venv|build|dist|artifacts|\.tmp|build-debug|dist-debug)/'

[[tool.mypy.overrides]]
module = ["ui.*", "tests.*"]
ignore_errors = true
